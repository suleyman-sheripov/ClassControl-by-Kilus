<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Архитектура системы ClassControl</title>
    <style>
        body {
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .canvas-container {
            padding: 40px 60px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <svg width="800" height="560" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Тень для блоков -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.1" />
                </filter>
                
                <!-- Наконечники стрелок (Серые, служебный трафик) -->
                <marker id="arr-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                    <path d="M 0 0 L 12 6 L 0 12 Z" fill="#475569" />
                </marker>
                
                <!-- Наконечники стрелок (Синие, медиа трафик) -->
                <marker id="arr-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                    <path d="M 0 0 L 12 6 L 0 12 Z" fill="#2563eb" />
                </marker>
            </defs>

            <!-- ================= ЛИНИИ СВЯЗИ (СТРОГО ПОД 90 ГРАДУСОВ) ================= -->
            
            <!-- 1. Внутренний обмен (Учитель <-> Сервер) -->
            <path d="M 400 180 L 400 120" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />
            <path d="M 400 180 L 400 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />

            <!-- 2. Управление и поиск (Сервер <-> Агенты) -->
            <path d="M 255 380 L 340 380 L 340 320" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />
            <path d="M 255 380 L 170 380 L 170 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />

            <!-- 3. Сообщения и доска (Сервер <-> Удаленные) -->
            <path d="M 545 380 L 460 380 L 460 320" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />
            <path d="M 545 380 L 630 380 L 630 440" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arr-gray)" />

            <!-- 4. Прямая видеотрансляция (Учитель <-> Агенты) -->
            <path d="M 80 260 L 80 80 L 270 80" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />
            <path d="M 80 260 L 80 440" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />

            <!-- 5. Прямая видеотрансляция (Учитель <-> Удаленные) -->
            <path d="M 720 260 L 720 80 L 530 80" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />
            <path d="M 720 260 L 720 440" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-blue)" />


            <!-- ================= ТЕКСТОВЫЕ ПОДПИСИ НАД ЛИНИЯМИ ================= -->
            
            <rect x="330" y="165" width="140" height="30" fill="#ffffff" />
            <text x="400" y="185" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">Внутренний обмен</text>

            <rect x="175" y="360" width="160" height="40" fill="#ffffff" />
            <text x="255" y="375" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">Управление, снимки</text>
            <text x="255" y="393" text-anchor="middle" font-size="13" fill="#475569">и поиск в сети</text>

            <rect x="470" y="360" width="150" height="40" fill="#ffffff" />
            <text x="545" y="375" text-anchor="middle" font-size="14" fill="#1e293b" font-weight="600">Сообщения</text>
            <text x="545" y="393" text-anchor="middle" font-size="13" fill="#475569">и доска</text>

            <rect x="90" y="250" width="175" height="20" fill="#ffffff" />
            <text x="95" y="264" font-size="14" fill="#2563eb" font-weight="bold">🎥 Прямая видеотрансляция</text>

            <rect x="535" y="250" width="175" height="20" fill="#ffffff" />
            <text x="710" y="264" text-anchor="end" font-size="14" fill="#2563eb" font-weight="bold">🎥 Прямая видеотрансляция</text>


            <!-- ================= ГЛАВНЫЕ БЛОКИ (СТРОГИЕ ПРЯМОУГОЛЬНИКИ) ================= -->
            
            <!-- Учитель -->
            <rect x="270" y="40" width="260" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="76" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">💻 Приложение преподавателя</text>
            <text x="400" y="98" text-anchor="middle" font-size="14" fill="#475569">(Настольное)</text>

            <!-- Сервер -->
            <rect x="270" y="240" width="260" height="80" fill="#fefce8" stroke="#ca8a04" stroke-width="2" filter="url(#shadow)" />
            <text x="400" y="276" text-anchor="middle" font-size="16" font-weight="bold" fill="#854d0e">⚙️ Сервер маршрутизации</text>
            <text x="400" y="298" text-anchor="middle" font-size="14" fill="#475569">(Служба)</text>

            <!-- Агенты -->
            <rect x="40" y="440" width="260" height="80" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
            <text x="170" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#14532d">🖥️ Программы-агенты</text>
            <text x="170" y="498" text-anchor="middle" font-size="14" fill="#475569">(Локальная сеть)</text>

            <!-- Веб-клиенты -->
            <rect x="500" y="440" width="260" height="80" fill="#fff7ed" stroke="#ea580c" stroke-width="2" filter="url(#shadow)" />
            <text x="630" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">🌐 Удаленные участники</text>
            <text x="630" y="498" text-anchor="middle" font-size="14" fill="#475569">(Сеть Интернет)</text>

        </svg>
    </div>
</body>
</html>
