<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassControl — Онлайн-участник</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ============ ЭКРАН ВХОДА ============ -->
  <div id="login-screen" class="login-screen">
    <div class="login-backdrop">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>

    <div class="login-card">
      <div class="login-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </div>
        <h1 class="brand-name">ClassControl</h1>
        <p class="brand-tagline">Подключитесь к уроку онлайн</p>
      </div>

      <div class="login-form">
        <div class="form-field">
          <label for="name-input">Ваше имя</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="name-input" placeholder="Введите ваше имя..." maxlength="30" autocomplete="off">
          </div>
        </div>

        <button id="join-btn" class="login-submit">
          <span>Войти в класс</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ ТОСТЫ ============ -->
  <div id="toast-container" class="toast-container"></div>

  <!-- ============ ОСНОВНОЙ ЭКРАН ============ -->
  <div id="main-screen" class="hidden">

    <!-- Хедер -->
    <header class="app-header">
      <div class="app-header__left">
        <div class="app-logo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        </div>
        <span class="app-header__title">ClassControl</span>
        <span class="app-header__divider"></span>
        <div class="status-pill status-pill--online">
          <span class="status-pill__dot"></span>
          <span>Онлайн</span>
        </div>
      </div>
      <div class="app-header__right">
        <span id="user-name-display" class="app-header__user"></span>
        <button id="leave-btn" class="btn-leave">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span>Выйти</span>
        </button>
      </div>
    </header>

    <!-- Контент -->
    <div class="app-body">

      <!-- Левая часть: Видео + Панель -->
      <div class="app-body__main">
        <div class="media-card">
          <div id="video-area" class="media-card__viewport">
            <video id="teacher-video" autoplay playsinline></video>
            <canvas id="teacher-canvas"></canvas>
            <div id="waiting-msg" class="media-card__placeholder">
              <div class="placeholder-icon">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              </div>
              <span>Ожидание демонстрации учителя...</span>
            </div>
          </div>
        </div>

        <div id="share-bar" class="share-toolbar">
          <button id="share-screen-btn" class="btn-share">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M12 7v4M10 9h4"/></svg>
            <span>Показать мой экран</span>
          </button>
          <span id="share-timer" class="share-toolbar__timer hidden">05:00</span>
          <button id="stop-share-btn" class="btn-stop hidden">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
            <span>Остановить</span>
          </button>
        </div>
      </div>

      <!-- Правая часть: Чат -->
      <aside class="chat-sidebar">
        <div class="chat-sidebar__header">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
          <span>Чат урока</span>
        </div>

        <div id="chat-messages" class="chat-sidebar__messages"></div>

        <div id="chat-input-area" class="chat-sidebar__input">
          <button id="attach-btn" class="chat-icon-btn" title="Прикрепить файл">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" class="hidden">
          <input type="text" id="msg-input" placeholder="Написать сообщение..." autocomplete="off">
          <button id="send-btn" class="chat-send-btn" title="Отправить">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>
      </aside>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
