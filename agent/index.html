<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>StreamHub Agent - Настройки</title>
    <style>
        body { font-family: 'Inter', 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 2rem; background: linear-gradient(135deg, #0f172a 0%, #1e1e2f 100%); color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; box-sizing: border-box; }
        .card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 2rem; border-radius: 16px; width: 100%; max-width: 380px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); }
        h2 { margin-top: 0; margin-bottom: 1.5rem; text-align: center; color: #10b981; font-weight: 600; font-size: 1.5rem; letter-spacing: -0.5px; }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #94a3b8; font-weight: 500; }
        input { width: 100%; padding: 0.875rem 1rem; border-radius: 8px; border: 1px solid #334155; background: rgba(15, 23, 42, 0.5); color: white; font-size: 1rem; box-sizing: border-box; transition: all 0.2s ease; outline: none; }
        input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        .btn { width: 100%; padding: 0.875rem 1rem; border-radius: 8px; border: none; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-top: 0.5rem; }
        .btn-primary { background: linear-gradient(to right, #10b981, #059669); color: white; box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.3); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 8px -1px rgba(16, 185, 129, 0.4); filter: brightness(1.1); }
        .btn-primary:active { transform: translateY(0); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn-danger:hover { background: #ef4444; color: white; border-color: #ef4444; }
        .status { margin-top: 1.5rem; padding: 1rem; border-radius: 8px; text-align: center; font-weight: 500; font-size: 0.95rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: all 0.3s ease; }
        .status::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
        .status.disconnected { background: rgba(239, 68, 68, 0.1); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status.disconnected::before { background-color: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status.connected { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status.connected::before { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .hint { color: #64748b; font-size: 0.8rem; text-align: center; margin-top: 1.5rem; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top: 0; text-align: center; color: #10b981;">StreamHub Agent</h2>
        
        <div class="input-group">
            <label>🌐 Адрес сервера</label>
            <input type="text" id="serverUrl" placeholder="http://localhost:3000" />
        </div>
        
        <div class="input-group">
            <label>💻 Имя ПК</label>
            <input type="text" id="pcName" placeholder="PC-Class-1" />
        </div>

        <div class="input-group">
            <label>🔑 ID Комнаты</label>
            <input type="text" id="roomId" value="SCHOOL" />
        </div>

        <button id="connectBtn" class="btn btn-primary">Сохранить и Подключиться</button>
        <button id="disconnectBtn" class="btn btn-danger" style="display: none;">Отключиться от сервера</button>

        <div id="statusBox" class="status disconnected">Статус: В ожидании...</div>

        <p class="hint">Если вы закроете это окно крестиком, оно просто свернется в системный трей (возле часов Windows) и продолжит работу незаметно.</p>
    </div>

    <video id="dummyVideo" style="display:none;" autoplay playsinline muted></video>

    <script src="renderer.js"></script>
</body>
</html>
