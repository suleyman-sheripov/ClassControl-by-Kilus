<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Кто за компьютером?</title>
  <link rel="stylesheet" href="../../shared/ui/theme.css">
  <script src="../../shared/ui/theme-init.js"></script>
  <script src="../../shared/ui/mascot.js"></script>
  <link rel="stylesheet" href="agent.css">
</head>
<body>
  <form class="note-win hello" id="form">
    <div class="note-win__head">
      <cc-finger point="right" motion="tap" size="34"></cc-finger>
      <span class="note-win__from">Урок начался</span>
    </div>
    <div class="hello__body">
      <label class="field">
        <span class="field__label">Как вас зовут? Учитель увидит имя рядом с этим компьютером</span>
        <input class="input input--lg" id="name" maxlength="40" placeholder="Имя и фамилия" autocomplete="off" list="roster" autofocus>
        <datalist id="roster"></datalist>
      </label>
      <div class="hello__taken hidden" id="taken">
        <p class="hello__q" id="taken-text"></p>
        <div class="hello__actions">
          <button class="btn btn--primary" id="yes" type="button">Да, я пересел сюда</button>
          <button class="btn" id="no" type="button">Нет, это другой человек</button>
        </div>
      </div>
    </div>
    <div class="note-win__foot">
      <button class="btn btn--ghost" id="skip" type="button" style="margin-right:8px">Пропустить</button>
      <button class="btn btn--primary" type="submit">Готово</button>
    </div>
  </form>
  <script src="../../shared/ui/icons.js"></script>
  <script src="hello.js"></script>
</body>
</html>
