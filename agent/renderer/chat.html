<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: http: https:; connect-src 'self' http: ws:; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Беседа урока</title>
  <link rel="stylesheet" href="../../shared/ui/theme.css">
  <script src="../../shared/ui/theme-init.js"></script>
  <script src="../../shared/ui/mascot.js"></script>
  <link rel="stylesheet" href="agent.css">
</head>
<body>
  <div class="chat-app">
    <header class="chat-head">
      <span class="brand__mark"><cc-finger point="right" size="30"></cc-finger></span>
      <div class="chat-head__text">
        <span class="chat-head__title">Беседа урока</span>
        <span class="chat-head__sub"><span class="dot" id="dot"></span><span id="status">Ищу учителя в сети…</span></span>
      </div>
    </header>
    <div class="chat" id="chat">
      <div class="chat__list"></div>
      <div class="composer">
        <div class="composer__to hidden"></div>
        <div class="composer__box">
          <button class="icon-btn icon-btn--sm composer__attach" type="button" title="Отправить файл" aria-label="Отправить файл"><svg class="i"><use href="#i-clip"/></svg></button>
          <input type="file" class="composer__file hidden">
          <textarea class="composer__input" rows="1" placeholder="Сообщение классу…" aria-label="Сообщение"></textarea>
          <button class="icon-btn icon-btn--sm composer__send" type="button" aria-label="Отправить" disabled><svg class="i i-sm"><use href="#i-send"/></svg></button>
        </div>
      </div>
    </div>
  </div>
  <script src="../../shared/ui/icons.js"></script>
  <script src="../../shared/ui/common.js"></script>
  <script src="chat.js"></script>
</body>
</html>
