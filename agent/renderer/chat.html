<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ClassControl — Чат</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0b10;
      --bg-panel: #161923;
      --bg-card: #1c1f2e;
      --bg-input: #1a1d2b;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --text-primary: #f0f0f3;
      --text-secondary: #9ca3b0;
      --text-muted: #6b7280;
      --border: rgba(255, 255, 255, 0.06);
      --success: #10b981;
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 14px 16px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header::before {
      content: '';
      width: 8px;
      height: 8px;
      background: var(--success);
      border-radius: 50%;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    .msg {
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 8px 12px;
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .msg .author { font-weight: 600; color: var(--accent); margin-right: 4px; }
    .msg.file a { color: var(--success); text-decoration: none; font-weight: 500; }
    .msg.file a:hover { text-decoration: underline; }
    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-panel);
      align-items: center;
    }
    #text-input {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: var(--radius);
      outline: none;
      font-size: 0.88rem;
      transition: border-color 0.2s;
    }
    #text-input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    button:hover { background: var(--accent-hover); }
    .attach-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 38px;
      height: 38px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .attach-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="header">Чат класса</div>
  <div id="messages"></div>
  <div class="input-area">
    <button class="attach-btn" id="attachBtn" title="Прикрепить файл">+</button>
    <input type="file" id="fileInput" style="display:none">
    <input type="text" id="text-input" placeholder="Сообщение...">
    <button id="sendBtn">Отправить</button>
  </div>

  <script src="../node_modules/socket.io-client/dist/socket.io.js"></script>
  <script>
    let socket = null;
    const myName = window.electronAPI?.hostname || 'Ученик';

    window.electronAPI.onServerAddress((address) => {
      if (socket) return;
      socket = io(address);
      socket.on('connect', () => {
        socket.emit('request-chat-history');
      });
      socket.on('chat-message', renderMessage);
      socket.on('chat-file', renderFile);
      socket.on('chat-history', (h) => h.forEach(m => m.type==='file' ? renderFile(m) : renderMessage(m)));
    });

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('text-input').addEventListener('keypress', e => { if (e.key==='Enter') send(); });

    function send() {
      const text = document.getElementById('text-input').value.trim();
      if (!text || !socket) return;
      socket.emit('chat-message', { sender: myName, text });
      document.getElementById('text-input').value = '';
    }

    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file); fd.append('sender', myName);
      try {
        await fetch(socket.io.uri + '/upload', { method: 'POST', body: fd });
      } catch (err) {
        console.error('[AGENT] File upload failed:', err);
      }
      e.target.value = '';
    });

    function renderMessage(m) {
      const d = document.createElement('div'); d.className = 'msg';
      const authorSpan = document.createElement('span');
      authorSpan.className = 'author';
      authorSpan.textContent = m.sender + ':';
      d.appendChild(authorSpan);
      d.appendChild(document.createTextNode(' ' + m.text));
      document.getElementById('messages').appendChild(d);
      d.scrollIntoView({ behavior: 'smooth' });
    }
    function renderFile(m) {
      const d = document.createElement('div'); d.className = 'msg file';
      const authorSpan = document.createElement('span');
      authorSpan.className = 'author';
      authorSpan.textContent = m.sender + ':';
      d.appendChild(authorSpan);
      d.appendChild(document.createTextNode(' '));
      const link = document.createElement('a');
      link.href = socket.io.uri + m.url;
      link.target = '_blank';
      link.textContent = m.filename;
      d.appendChild(link);
      document.getElementById('messages').appendChild(d);
      d.scrollIntoView({ behavior: 'smooth' });
    }
  </script>
</body>
</html>
