<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>ClassControl — Чат</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-bg:      #0b0c10;
      --c-surface: #13151d;
      --c-card:    #191c27;
      --c-input:   #1e2130;
      --c-border:  rgba(255,255,255,.06);
      --c-border-h:rgba(255,255,255,.10);
      --c-accent:  #6c5ce7;
      --c-grad:    linear-gradient(135deg, #6c5ce7, #4ea0f7);
      --c-green:   #2ed8a4;
      --c-text:    #eaedf3;
      --c-text2:   #8a8faa;
      --c-text3:   #50546e;
      --r: 8px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Inter',-apple-system,sans-serif;
      background:var(--c-bg);color:var(--c-text);
      height:100vh;display:flex;flex-direction:column;
      -webkit-font-smoothing:antialiased;
    }

    /* Header */
    .header{
      padding:12px 16px;
      background:var(--c-surface);
      border-bottom:1px solid var(--c-border);
      display:flex;align-items:center;gap:10px;
      flex-shrink:0;
    }
    .header-logo{
      width:28px;height:28px;
      background:var(--c-grad);border-radius:8px;
      display:flex;align-items:center;justify-content:center;
      color:#fff;flex-shrink:0;
      box-shadow:0 3px 10px rgba(108,92,231,.2);
    }
    .header-text{flex:1;font-weight:600;font-size:.88rem;color:#fff}
    .status-badge{
      display:flex;align-items:center;gap:5px;
      background:rgba(46,216,164,.1);color:var(--c-green);
      padding:3px 10px;border-radius:100px;
      font-size:.68rem;font-weight:600;
    }
    .status-badge__dot{
      width:6px;height:6px;border-radius:50%;
      background:var(--c-green);
      animation:blink 2s ease-in-out infinite;
    }
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

    /* Messages */
    #messages{
      flex:1;overflow-y:auto;padding:14px;
      display:flex;flex-direction:column;gap:6px;
    }
    #messages::-webkit-scrollbar{width:3px}
    #messages::-webkit-scrollbar-track{background:transparent}
    #messages::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:3px}
    .msg{
      font-size:.85rem;line-height:1.55;
      padding:9px 12px;
      background:var(--c-card);border-radius:var(--r);
      border:1px solid var(--c-border);
    }
    .msg .author{font-weight:600;color:var(--c-accent);margin-right:5px}
    .msg.file a{color:var(--c-green);text-decoration:none;font-weight:500}
    .msg.file a:hover{text-decoration:underline}

    /* Input area */
    .input-area{
      display:flex;gap:6px;padding:12px;
      border-top:1px solid var(--c-border);
      background:var(--c-card);align-items:center;
      flex-shrink:0;
    }
    #text-input{
      flex:1;background:var(--c-input);
      border:1.5px solid var(--c-border-h);
      color:#fff;padding:10px 12px;
      border-radius:var(--r);outline:none;
      font-size:.85rem;transition:border-color .25s;
    }
    #text-input:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px rgba(108,92,231,.1)}
    #text-input::placeholder{color:var(--c-text3)}
    .send-btn{
      width:36px;height:36px;
      background:var(--c-grad);color:#fff;
      border:none;border-radius:var(--r);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      transition:all .2s;flex-shrink:0;
    }
    .send-btn:hover{box-shadow:0 3px 10px rgba(108,92,231,.3);transform:translateY(-1px)}
    .attach-btn{
      width:36px;height:36px;
      background:var(--c-input);border:1px solid var(--c-border-h);
      color:var(--c-text2);border-radius:var(--r);
      cursor:pointer;display:flex;align-items:center;justify-content:center;
      flex-shrink:0;padding:0;transition:all .2s;
    }
    .attach-btn:hover{background:var(--c-accent);color:#fff;border-color:var(--c-accent)}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    </div>
    <span class="header-text">Чат класса</span>
    <div class="status-badge">
      <span class="status-badge__dot"></span>
      Подключено
    </div>
  </div>
  <div id="messages"></div>
  <div class="input-area">
    <button class="attach-btn" id="attachBtn" title="Прикрепить файл">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
    </button>
    <input type="file" id="fileInput" style="display:none">
    <input type="text" id="text-input" placeholder="Написать сообщение...">
    <button class="send-btn" id="sendBtn" title="Отправить">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>

  <script src="../node_modules/socket.io-client/dist/socket.io.js"></script>
  <script>
    let socket = null;
    const myName = window.electronAPI?.hostname || 'Ученик';

    window.electronAPI.onServerAddress((address) => {
      if (socket) return;
      socket = io(address);
      socket.on('connect', () => {
        socket.emit('request-chat-history');
      });
      socket.on('chat-message', renderMessage);
      socket.on('chat-file', renderFile);
      socket.on('chat-history', (h) => h.forEach(m => m.type==='file' ? renderFile(m) : renderMessage(m)));
    });

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('text-input').addEventListener('keypress', e => { if (e.key==='Enter') send(); });

    function send() {
      const text = document.getElementById('text-input').value.trim();
      if (!text || !socket) return;
      socket.emit('chat-message', { sender: myName, text });
      document.getElementById('text-input').value = '';
    }

    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0]; if (!file) return;
      const maxSize = 10 * 1024 * 1024;
      if (file.size > maxSize) { alert('Файл слишком большой (макс. 10 МБ)'); return; }
      const fd = new FormData();
      fd.append('file', file);
      fd.append('sender', myName);
      try {
        await fetch(socket.io.uri + '/upload', { method: 'POST', body: fd });
      } catch (err) {
        console.error('[AGENT] File upload failed:', err);
      }
      e.target.value = '';
    });

    function renderMessage(m) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = '<span class="author">' + escapeHtml(m.sender) + ':</span>' + escapeHtml(m.text);
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function renderFile(m) {
      const div = document.createElement('div');
      div.className = 'msg file';
      const url = m.url || '#';
      div.innerHTML = '<span class="author">' + escapeHtml(m.sender) + ':</span> <a href="' + escapeHtml(url) + '" download="' + escapeHtml(m.filename || m.fileName) + '">' + escapeHtml(m.filename || m.fileName) + '</a>';
      document.getElementById('messages').appendChild(div);
      div.scrollIntoView({ behavior: 'smooth' });
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
