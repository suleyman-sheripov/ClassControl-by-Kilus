<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' http:; connect-src 'self' http: ws:; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'; font-src 'self'">
  <title>Эфир учителя</title>
  <link rel="stylesheet" href="../../shared/ui/theme.css">
  <style>
    html, body { background: #000; overflow: hidden; cursor: default; }
    .stage { position: fixed; inset: 0; }
    #video { position: absolute; inset: 0; }
    .wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: var(--muted); font-size: var(--fs-lg); }
    .exit { position: fixed; top: 16px; right: 16px; z-index: 5; opacity: 0; transition: opacity .2s; background: rgba(19,19,21,.9); }
    body:hover .exit { opacity: 1; }
    .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--control); border-top-color: var(--text); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .unmute { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 5; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="video" class="stage__video" autoplay playsinline></video>
    <div class="board-surface hidden" id="board-surface"><canvas id="board" class="board-canvas"></canvas></div>
    <div class="wait" id="wait"><span class="spinner"></span><span id="wait-text">Подключаюсь к эфиру учителя…</span></div>
  </div>
  <button class="btn exit hidden" id="exit" type="button"><svg class="i i-sm"><use href="#i-x"/></svg>Свернуть <span class="kbd">Esc</span></button>
  <button class="btn btn--primary unmute hidden" id="unmute" type="button"><svg class="i i-sm"><use href="#i-volume"/></svg>Включить звук</button>
  <script src="../../shared/ui/icons.js"></script>
  <script src="../../shared/ui/common.js"></script>
  <script src="../../shared/ui/viewer.js"></script>
  <script src="demo.js"></script>
</body>
</html>
