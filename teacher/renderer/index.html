<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassControl — Учитель</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container" class="app">

        <!-- ===== HEADER ===== -->
        <header class="main-header">
            <div class="logo">
                <div class="logo__icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                </div>
                <span class="logo__text">ClassControl</span>
            </div>

            <div class="header-center">
                <nav class="tabs">
                    <button id="tab-monitoring" class="tab-btn active">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        <span>Мониторинг</span>
                    </button>
                    <button id="tab-whiteboard" class="tab-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        <span>Доска</span>
                    </button>
                </nav>
            </div>

            <div class="header-right">
                <div id="record-timer" class="rec-badge hidden">
                    <span class="rec-badge__dot"></span>
                    <span>00:00</span>
                </div>
                <button id="recordBtn" class="hdr-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
                    <span>Запись</span>
                </button>
                <div class="user-profile">
                    <span id="teacher-name-display">Учитель</span>
                    <div class="status-indicator online"></div>
                </div>
            </div>
        </header>

        <!-- ===== CONTENT ===== -->
        <main class="content-layout">

            <!-- SIDEBAR LEFT: Студия эфира + Инструменты доски -->
            <aside class="sidebar sidebar-left" id="panel-left">
                <section class="panel studio-panel">
                    <div class="panel-header">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                        <h3>Студия эфира</h3>
                    </div>
                    <div class="broadcast-preview">
                        <video id="preview-video" autoplay playsinline muted></video>
                        <div id="preview-placeholder" class="preview-placeholder">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                            <span>Нет активного потока</span>
                        </div>
                    </div>

                    <div class="studio-controls">
                        <label class="control-label">Качество</label>
                        <select id="qualitySelect" class="styled-select">
                            <option value="1920x1080">1080p (Full HD)</option>
                            <option value="1280x720">720p (HD)</option>
                            <option value="854x480" selected>480p (SD)</option>
                            <option value="640x360">360p</option>
                            <option value="426x240">240p</option>
                            <option value="320x180">180p (min)</option>
                        </select>

                        <label class="control-label">Частота кадров</label>
                        <select id="fpsSelect" class="styled-select">
                            <option value="5">5 FPS</option>
                            <option value="10">10 FPS</option>
                            <option value="15" selected>15 FPS</option>
                            <option value="20">20 FPS</option>
                            <option value="30">30 FPS</option>
                            <option value="60">60 FPS</option>
                        </select>

                        <button id="btn-start-broadcast" class="btn btn-primary w-full mt-4">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Начать эфир
                        </button>
                        <button id="btn-stop-broadcast" class="btn btn-danger w-full mt-4 hidden">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                            Остановить эфир
                        </button>
                    </div>
                </section>

                <section id="whiteboard-tools-section" class="panel tools-panel hidden">
                    <div class="panel-header">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
                        <h3>Инструменты</h3>
                    </div>
                    <div class="tools-grid">
                        <button id="tool-brush" class="tool-btn active" title="Кисть">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            Кисть
                        </button>
                        <button id="tool-eraser" class="tool-btn" title="Ластик">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9.5-9.5a2.83 2.83 0 014 0l3 3a2.83 2.83 0 010 4L13 20"/></svg>
                            Ластик
                        </button>
                        <button id="tool-hand" class="tool-btn" title="Перетаскивание (Рука)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13V5a2 2 0 114 0v4M14 13V7a2 2 0 114 0v5M18 13v-2a2 2 0 114 0v8a8 8 0 01-8 8H9a8 8 0 01-8-8v-6a2 2 0 114 0v5M6 13V4a2 2 0 114 0v9"/></svg>
                            Рука
                        </button>
                        <button id="clear-canvas-btn" class="tool-btn danger" title="Очистить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                            Очистить
                        </button>
                    </div>
                    <div id="brush-color-row" class="tool-row">
                        <label>Цвет:</label>
                        <input type="color" id="colorPicker" value="#6366f1">
                    </div>
                    <div class="tool-row">
                        <label>Толщина:</label>
                        <input type="range" id="lineWidth" min="1" max="25" value="5">
                    </div>
                </section>
            </aside>

            <div class="resizer" id="resizer-left"></div>

            <!-- CENTER -->
            <section class="main-viewport">
                <div id="monitoring-grid" class="monitoring-grid">
                    <div class="grid-placeholder">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                        <span>Ожидание подключения компьютеров...</span>
                    </div>
                </div>

                <div id="whiteboard-container" class="whiteboard-container hidden">
                    <canvas id="whiteboard"></canvas>
                    <!-- Плавающая панель зума -->
                    <div class="zoom-controls">
                        <button id="zoom-out" class="zoom-btn" title="Отдалить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
                        </button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in" class="zoom-btn" title="Приблизить">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        </button>
                        <button id="zoom-reset" class="zoom-btn zoom-btn--reset" title="Сбросить масштаб">1:1</button>
                    </div>
                </div>
            </section>

            <div class="resizer" id="resizer-right"></div>

            <!-- SIDEBAR RIGHT: Участники + Чат -->
            <aside class="sidebar sidebar-right" id="panel-right">
                <!-- Подпанель: Списки участников (компактная) -->
                <section class="panel participants-combined-panel">
                    <div class="panel-header">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                        <h3>Участники
                            <span class="count-badge" id="agents-count">0</span>
                            <span class="participants-separator">+</span>
                            <span class="count-badge count-badge--online" id="online-count">0</span>
                        </h3>
                    </div>
                    <div class="participants-lists">
                        <div class="participants-group">
                            <div class="participants-group__label">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
                                В классе
                            </div>
                            <ul id="agents-list" class="item-list"></ul>
                        </div>
                        <div class="participants-group">
                            <div class="participants-group__label">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
                                Онлайн
                            </div>
                            <ul id="online-users-list" class="item-list"></ul>
                        </div>
                    </div>
                </section>

                <!-- Подпанель: Чат (основная) -->
                <section class="panel chat-panel">
                    <div class="panel-header">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                        <h3>Чат</h3>
                    </div>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input-wrapper">
                        <button id="chat-attach-btn" class="chat-action-btn" title="Прикрепить файл">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
                        </button>
                        <input type="file" id="chat-file-input" class="hidden">
                        <input type="text" id="chat-text-input" placeholder="Написать..." autocomplete="off">
                        <button id="chat-send-btn" class="chat-send-btn">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                        </button>
                    </div>
                </section>
            </aside>
        </main>

        <!-- ===== MODALS ===== -->
        <div id="remote-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="remote-modal-title">Удаленное управление: ПК-01</h2>
                    <button id="remote-modal-close" class="close-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="remote-viewer-wrapper">
                    <video id="remote-video" autoplay playsinline></video>
                    <div id="remote-mouse-catcher" class="mouse-catcher"></div>
                </div>
            </div>
        </div>

        <div id="student-share-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="student-share-title">Демонстрация ученика</h2>
                    <button id="student-share-close" class="close-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="remote-viewer-wrapper">
                    <video id="student-share-video" autoplay playsinline></video>
                    <div id="student-share-status" class="share-status">Подключение...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
